name: Build KeyNova Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  issues: write

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 200 build.log > build-tail.txt
          grep -n "e: \|FAILURE\|error:\|Exception\|Unresolved" build.log | tail -n 120 > build-errors.txt || true
          BODY=$(printf "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n## Errors\n\`\`\`\n"; cat build-errors.txt; printf "\n\`\`\`\n\n## Tail\n\`\`\`\n"; tail -n 120 build.log; printf "\n\`\`\`\n")
          gh issue create --repo "${{ github.repository }}" --title "CI build failure run ${{ github.run_id }}" --body "$BODY" || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build-tail.txt
            build-errors.txt
            **/build/reports/**
          if-no-files-found: warn
